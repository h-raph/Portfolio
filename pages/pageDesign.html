        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=Zhi+Mang+Xing&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/mainStyle.css">
    <script src="../assets/js/pageDesign.js" defer></script>

<body class="ds-body">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <filter id="rough">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
        </filter>
    </svg>

    <button id="btn-dessin" type="button" aria-pressed="false" aria-label="Dessiner un geste"
        title="Dessiner un geste"><span aria-hidden="true">筆</span></button>
    <div id="aide-dessin" role="status" hidden>
        <ul class="modeles">
            <li><span class="modele" aria-hidden="true">夜</span><span>Thème sombre</span></li>
            <li><span class="modele" aria-hidden="true">日</span><span>Thème clair</span></li>
            <li><svg class="modele" viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="6"
                        stroke-linecap="round" stroke-dasharray="240 12" transform="rotate(-90 50 50)" />
                </svg><span>Goutte d’encre</span></li>
        </ul>
        <p>Trace l’un de ces gestes, en un seul trait pour le cercle. Échap pour quitter.</p>
    </div>
    <div id="msg-geste" role="status"></div>
</body>
